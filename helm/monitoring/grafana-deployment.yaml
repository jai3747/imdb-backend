      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": [],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "Node Exporter Overview",
      "weekStart": ""
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
type: Opaque
data:
  admin-password: YWRtaW4= # Base64 encoded 'admin' - change this to a secure password
