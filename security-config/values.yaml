# Security Scanning Configuration
# Define repositories to scan and their configurations

repositories:
- name: food-waste-management
  repository: jai3747/food_waste_management
  language: python
  runtime_version: "3.9"
  environment: backend
  description: "Food Waste Management System"
  install_command: "" # Leave empty to use default pip install

# Global scanning settings
settings:
  # Scan scheduling
  schedule:
    enabled: false
    cron: "0 2 * * *" # Daily at 2 AM UTC

  # Security thresholds
  thresholds:
    critical: 0 # Fail if any critical vulnerabilities
    high: 5 # Fail if more than 5 high vulnerabilities
    medium: 20 # Fail if more than 20 medium vulnerabilities

  # Notification settings
  notifications:
    enabled: false
    channels:
    - email
    - slack

  # Report retention
  retention:
    days: 30
