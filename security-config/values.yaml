# Security Scanning Configuration
# Define repositories to scan and their configurations

repositories:
- name: food-waste-management
  repository: jai3747/imdb-backend
  language: node
  runtime_version: "20"
  environment: backend
  description: "Food Waste Management System"
  install_command: ""

# Global scanning settings
settings:
  # Scan scheduling
  schedule:
    enabled: false
    cron: "0 2 * * *"

  # Security thresholds
  thresholds:
    critical: 0
    high: 5
    medium: 20

  # Notification settings
  notifications:
    enabled: false
    channels:
    - email
    - slack

  # Report retention
  retention:
    days: 30
