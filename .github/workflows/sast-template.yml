name: SAST (Static Application Security Testing) Scanning

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
        description: "Path to the scanning configuration file"
      target_environment:
        required: false
        type: string
        default: "all"
        description: "Target environment to scan (frontend/backend/all)"
    secrets:
      GH_PAT:
        required: true
      SEMGREP_TOKEN:
        required: true

jobs:
  load-config:
    name: 📋 Load Configuration
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.parse-config.outputs.repositories }}
    steps:
    - name: Checkout Config Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Parse Configuration
      id: parse-config
      run: |
        if [ ! -f "${{ inputs.config_file }}" ]; then
          echo "Configuration file not found: ${{ inputs.config_file }}"
          exit 1
        fi

        # Install yq for YAML parsing
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

        # Extract repositories list
        REPOS=$(yq e '.repositories | @json' "${{ inputs.config_file }}")
        echo "repositories=$REPOS" >> $GITHUB_OUTPUT

  sast-scan:
    name: 🔍 SAST Scan - ${{ matrix.repo.name }}
    runs-on: ubuntu-latest
    needs: load-config
    strategy:
      matrix:
        repo: ${{ fromJson(needs.load-config.outputs.repositories) }}
      fail-fast: false
    steps:
    - name: Clean workspace
      run: |
        rm -rf * || true
        rm -rf .git || true
        rm -rf .[^.]* || true

    - name: Checkout Target Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repo.repository }}
        token: ${{ secrets.GH_PAT }}
        clean: true

    - name: Get Semgrep Configuration
      id: semgrep-config
      run: |
        # Define configurations based on language
        case "${{ matrix.repo.language }}" in
          "node"|"javascript")
            echo "config=p/security-audit p/javascript p/nodejs p/owasp-top-ten" >> $GITHUB_OUTPUT
            ;;
          "typescript")
            echo "config=p/security-audit p/javascript p/typescript p/react p/nodejs p/owasp-top-ten" >> $GITHUB_OUTPUT
            ;;
          "python")
            echo "config=p/security-audit p/python p/flask p/django p/owasp-top-ten" >> $GITHUB_OUTPUT
            ;;
          "php")
            echo "config=p/security-audit p/php p/laravel p/symfony p/owasp-top-ten" >> $GITHUB_OUTPUT
            ;;
          "dotnet"|"csharp")
            echo "config=p/security-audit p/csharp p/dotnet p/owasp-top-ten" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "config=p/security-audit p/owasp-top-ten" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Run Semgrep
      continue-on-error: true
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_TOKEN }}
      run: |
        # Install Semgrep
        python3 -m pip install semgrep

        # Run Semgrep with JSON output
        semgrep --config=${{ steps.semgrep-config.outputs.config }} --json --output=semgrep-results.json . || true

    - name: Run Bandit for Python
      if: matrix.repo.language == 'python'
      continue-on-error: true
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-results.json || true

    - name: Generate Summary
      if: always()
      run: |
        echo "# 🔍 ${{ matrix.repo.name }} SAST Results" > scan-summary.md
        echo "Repository: ${{ matrix.repo.repository }}" >> scan-summary.md
        echo "Language: ${{ matrix.repo.language }}" >> scan-summary.md
        echo "Scan Date: $(date)" >> scan-summary.md
        echo "" >> scan-summary.md

        TOTAL_FINDINGS=0

        # Process Semgrep results
        if [ -f "semgrep-results.json" ]; then
          SEMGREP_TOTAL=$(jq '.results | length' "semgrep-results.json" 2>/dev/null || echo "0")
          HIGH_FINDINGS=$(jq '[.results[] | select(.extra.severity == "HIGH")] | length' "semgrep-results.json" 2>/dev/null || echo "0")
          MEDIUM_FINDINGS=$(jq '[.results[] | select(.extra.severity == "MEDIUM")] | length' "semgrep-results.json" 2>/dev/null || echo "0")
          LOW_FINDINGS=$(jq '[.results[] | select(.extra.severity == "LOW")] | length' "semgrep-results.json" 2>/dev/null || echo "0")
          ERROR_FINDINGS=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "semgrep-results.json" 2>/dev/null || echo "0")
          
          echo "Semgrep Security Findings:" >> scan-summary.md
          echo "- Error: $ERROR_FINDINGS" >> scan-summary.md
          echo "- High: $HIGH_FINDINGS" >> scan-summary.md
          echo "- Medium: $MEDIUM_FINDINGS" >> scan-summary.md
          echo "- Low: $LOW_FINDINGS" >> scan-summary.md
          echo "- Total: $SEMGREP_TOTAL" >> scan-summary.md
          echo "" >> scan-summary.md
          
          TOTAL_FINDINGS=$((TOTAL_FINDINGS + SEMGREP_TOTAL))
        fi

        # Process Bandit results for Python
        if [ -f "bandit-results.json" ]; then
          BANDIT_HIGH=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' "bandit-results.json" 2>/dev/null || echo "0")
          BANDIT_MEDIUM=$(jq '[.results[] | select(.issue_severity == "MEDIUM")] | length' "bandit-results.json" 2>/dev/null || echo "0")
          BANDIT_LOW=$(jq '[.results[] | select(.issue_severity == "LOW")] | length' "bandit-results.json" 2>/dev/null || echo "0")
          BANDIT_TOTAL=$((BANDIT_HIGH + BANDIT_MEDIUM + BANDIT_LOW))
          
          echo "Bandit Python Security Findings:" >> scan-summary.md
          echo "- High: $BANDIT_HIGH" >> scan-summary.md
          echo "- Medium: $BANDIT_MEDIUM" >> scan-summary.md
          echo "- Low: $BANDIT_LOW" >> scan-summary.md
          echo "- Total: $BANDIT_TOTAL" >> scan-summary.md
          echo "" >> scan-summary.md
          
          TOTAL_FINDINGS=$((TOTAL_FINDINGS + BANDIT_TOTAL))
        fi

        # Generate overall summary
        if [ "$TOTAL_FINDINGS" -gt 0 ]; then
          echo "⚠️ $TOTAL_FINDINGS security issues found - Review and fix" >> scan-summary.md
        else
          echo "✅ No security issues detected" >> scan-summary.md
        fi

    - name: Upload Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sast-report-${{ matrix.repo.name }}
        path: |
          semgrep-results.json
          bandit-results.json
          scan-summary.md
        retention-days: 30
