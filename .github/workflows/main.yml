name: Enhanced Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan on Sundays
  workflow_dispatch:  # Manual trigger option

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper commit analysis
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install checkov trivy-scanner semgrep bandit
          curl -Lo kube-score.tar.gz https://github.com/zegl/kube-score/releases/latest/download/kube-score_1.16.1_linux_amd64.tar.gz
          tar -xzf kube-score.tar.gz && chmod +x kube-score && sudo mv kube-score /usr/local/bin/
          curl -Lo kubesec.tar.gz https://github.com/controlplaneio/kubesec/releases/latest/download/kubesec_linux_amd64.tar.gz
          tar -xzf kubesec.tar.gz && chmod +x kubesec && sudo mv kubesec /usr/local/bin/
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.42.0
          sudo apt-get update && sudo apt-get install -y jq

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      
      - name: Create scan results directory
        run: mkdir -p scan-results
      
      # Prepare default values files for Helm charts
      - name: Prepare Helm values
        run: |
          # Create default values files for any Helm charts that need them
          mkdir -p ./helm-values
          
          # Fix for the global.namespace issue
          echo "global:
            namespace: default
          " > ./helm-values/imdb-clone-values.yaml
          
          echo "Files in repository:"
          find . -type f | grep -v "node_modules" | sort
      
      # Kubernetes Manifests Scanning
      - name: Scan Kubernetes Manifests
        id: k8s-scan
        run: |
          echo "# Kubernetes Security Scan Results" > scan-results/kubernetes.md
          echo "## Checkov Results" >> scan-results/kubernetes.md
          
          # Count Kubernetes files
          k8s_files=$(find . -type f -name "*.yaml" -o -name "*.yml" | grep -v "node_modules" | grep -v "helm")
          k8s_count=$(echo "$k8s_files" | grep -v "^$" | wc -l)
          echo "Found $k8s_count Kubernetes manifest files to scan"
          
          if [ $k8s_count -gt 0 ]; then
            # Run Checkov on Kubernetes files
            checkov -d . --framework kubernetes --output cli --output-file-path scan-results/ || true
            
            # Run KubeScore
            for file in $k8s_files; do
              echo "Scanning $file with kube-score"
              kube-score score "$file" >> scan-results/kubescore.txt || true
            done
            
            # Run KubeSec
            for file in $k8s_files; do
              echo "Scanning $file with kubesec"
              kubesec scan "$file" >> scan-results/kubesec.json || true
            done
          fi
      
      # Docker Scanning
      - name: Scan Dockerfiles and Images
        id: docker-scan
        run: |
          echo "# Docker Security Scan Results" > scan-results/docker.md
          echo "## Checkov Results" >> scan-results/docker.md
          
          # Count Dockerfiles
          docker_files=$(find . -type f -name "Dockerfile*" | grep -v "node_modules")
          docker_count=$(echo "$docker_files" | grep -v "^$" | wc -l)
          echo "Found $docker_count Dockerfiles to scan"
          
          if [ $docker_count -gt 0 ]; then
            # Run Checkov on Dockerfiles
            checkov -d . --framework dockerfile --output cli --output-file-path scan-results/ || true
            
            # Run Trivy on Dockerfiles
            for file in $docker_files; do
              dir=$(dirname "$file")
              echo "Scanning $file with Trivy"
              trivy config "$file" --severity HIGH,CRITICAL --output scan-results/trivy-dockerfile-$(basename "$dir").txt || true
            done
          fi
          
          # Scan any existing Docker images
          if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            echo "Extracting images from docker-compose files"
            images=$(grep -E "image:.*" docker-compose.* | awk '{print $2}' | sort -u)
            
            for image in $images; do
              echo "Scanning Docker image: $image"
              trivy image "$image" --severity HIGH,CRITICAL --output scan-results/trivy-image-$(echo "$image" | tr '/:' '__').txt || true
            done
          fi
      
      # Terraform Scanning
      - name: Scan Terraform Files
        id: terraform-scan
        run: |
          echo "# Terraform Security Scan Results" > scan-results/terraform.md
          echo "## Checkov Results" >> scan-results/terraform.md
          
          # Count Terraform files
          tf_files=$(find . -type f -name "*.tf" | grep -v "node_modules")
          tf_count=$(echo "$tf_files" | grep -v "^$" | wc -l)
          echo "Found $tf_count Terraform files to scan"
          
          if [ $tf_count -gt 0 ]; then
            # Run Checkov on Terraform files
            checkov -d . --framework terraform --output cli --output-file-path scan-results/ || true
            
            # Run tfsec
            tfsec . --format json > scan-results/tfsec.json || true
          fi
      
      # Helm Chart Scanning with improved error handling
      - name: Scan Helm Charts
        id: helm-scan
        run: |
          echo "# Helm Chart Security Scan Results" > scan-results/helm.md
          echo "## Checkov Results" >> scan-results/helm.md
          
          # Find all Helm charts
          helm_dirs=$(find . -type f -name "Chart.yaml" | xargs -L1 dirname | sort -u)
          helm_count=$(echo "$helm_dirs" | grep -v "^$" | wc -l)
          echo "Found $helm_count Helm charts to scan"
          
          if [ $helm_count -gt 0 ]; then
            # For each Helm chart
            for chart_dir in $helm_dirs; do
              chart_name=$(basename "$chart_dir")
              echo "Processing Helm chart: $chart_name in $chart_dir"
              
              # Create temporary directory for rendered templates
              temp_dir=$(mktemp -d)
              
              # Check if custom values file exists
              values_file="./helm-values/${chart_name}-values.yaml"
              values_arg=""
              if [ -f "$values_file" ]; then
                values_arg="--values $values_file"
                echo "Using custom values file: $values_file"
              fi
              
              # Try to render templates with debug
              echo "Attempting to render Helm templates for $chart_name"
              helm template $chart_name "$chart_dir" $values_arg --debug --output-dir "$temp_dir" > "scan-results/helm-template-$chart_name.log" 2>&1 || true
              
              # Check if templates were generated
              template_files=$(find "$temp_dir" -type f -name "*.yaml" -o -name "*.yml")
              template_count=$(echo "$template_files" | grep -v "^$" | wc -l)
              
              if [ $template_count -gt 0 ]; then
                echo "Successfully rendered $template_count templates for $chart_name"
                
                # Scan rendered templates with checkov
                checkov -d "$temp_dir" --framework kubernetes --output cli --output-file-path "scan-results/helm-$chart_name" || true
                
                # Scan rendered templates with kubesec
                for file in $template_files; do
                  kubesec scan "$file" >> "scan-results/kubesec-helm-$chart_name.json" || true
                done
                
                # Scan rendered templates with kube-score
                kube-score score "$temp_dir"/**/*.yaml >> "scan-results/kubescore-helm-$chart_name.txt" 2>/dev/null || true
              else
                echo "Failed to render templates for $chart_name. Check log for details."
              fi
              
              # Clean up temp directory
              rm -rf "$temp_dir"
            done
          fi
      
      # Source Code Security Scanning
      - name: Scan Source Code
        id: code-scan
        run: |
          echo "# Source Code Security Scan Results" > scan-results/code.md
          
          # Run Semgrep
          echo "## Semgrep Results" >> scan-results/code.md
          semgrep --config=auto --json --output scan-results/semgrep.json . || true
          
          # Run Bandit for Python code
          py_files=$(find . -type f -name "*.py" | grep -v "node_modules" | grep -v "venv")
          py_count=$(echo "$py_files" | grep -v "^$" | wc -l)
          if [ $py_count -gt 0 ]; then
            echo "## Bandit Results (Python)" >> scan-results/code.md
            bandit -r . -f json -o scan-results/bandit.json || true
          fi
          
          # Run npm audit if package.json exists
          if [ -f "package.json" ]; then
            echo "## NPM Audit Results" >> scan-results/code.md
            npm audit --json > scan-results/npm-audit.json || true
          fi
          
          # Run dependency scanning with Trivy
          echo "## Dependency Scanning Results" >> scan-results/code.md
          trivy fs --security-checks vuln --severity HIGH,CRITICAL . > scan-results/trivy-deps.txt || true
      
      # Comprehensive scan with all frameworks
      - name: Run Comprehensive Scan
        id: comprehensive-scan
        run: |
          echo "Running comprehensive scan with all frameworks"
          checkov -d . --output cli --output-file-path scan-results/ || true
      
      # Analyze and summarize results
      - name: Analyze and Summarize Results
        id: analyze-results
        run: |
          echo "# Infrastructure as Code Security Scan Results" > scan-results/summary.md
          echo "Scan completed at $(date)" >> scan-results/summary.md
          
          # Create high severity issues file
          echo "# HIGH and CRITICAL Severity Security Issues" > scan-results/high-severity.md
          
          # Count and list high severity issues
          high_issues=0
          
          # Process checkov results
          if [ -f "scan-results/results_kubernetes.txt" ]; then
            high_k8s=$(grep -c "HIGH" scan-results/results_kubernetes.txt || echo "0")
            high_issues=$((high_issues + high_k8s))
            
            echo "## Kubernetes High Severity Issues ($high_k8s found)" >> scan-results/high-severity.md
            grep -A 3 "HIGH" scan-results/results_kubernetes.txt >> scan-results/high-severity.md || true
          fi
          
          if [ -f "scan-results/results_dockerfile.txt" ]; then
            high_docker=$(grep -c "HIGH" scan-results/results_dockerfile.txt || echo "0")
            high_issues=$((high_issues + high_docker))
            
            echo "## Docker High Severity Issues ($high_docker found)" >> scan-results/high-severity.md
            grep -A 3 "HIGH" scan-results/results_dockerfile.txt >> scan-results/high-severity.md || true
          fi
          
          if [ -f "scan-results/results_terraform.txt" ]; then
            high_tf=$(grep -c "HIGH" scan-results/results_terraform.txt || echo "0")
            high_issues=$((high_issues + high_tf))
            
            echo "## Terraform High Severity Issues ($high_tf found)" >> scan-results/high-severity.md
            grep -A 3 "HIGH" scan-results/results_terraform.txt >> scan-results/high-severity.md || true
          fi
          
          # Process Trivy results
          trivy_high=$(grep -c "HIGH\|CRITICAL" scan-results/trivy-deps.txt || echo "0")
          high_issues=$((high_issues + trivy_high))
          
          if [ $trivy_high -gt 0 ]; then
            echo "## Dependency High/Critical Severity Issues ($trivy_high found)" >> scan-results/high-severity.md
            grep -A 5 "HIGH\|CRITICAL" scan-results/trivy-deps.txt >> scan-results/high-severity.md || true
          fi
          
          # Add sections to summary
          echo "## Kubernetes Scan Results" >> scan-results/summary.md
          if [ -f "scan-results/results_kubernetes.txt" ]; then
            cat scan-results/results_kubernetes.txt >> scan-results/summary.md
          else
            echo "No results found. Either no files of this type exist or all checks passed." >> scan-results/summary.md
          fi
          echo "---" >> scan-results/summary.md
          
          echo "## Docker Scan Results" >> scan-results/summary.md
          if [ -f "scan-results/results_dockerfile.txt" ]; then
            cat scan-results/results_dockerfile.txt >> scan-results/summary.md
          else
            echo "No results found. Either no files of this type exist or all checks passed." >> scan-results/summary.md
          fi
          echo "---" >> scan-results/summary.md
          
          echo "## Terraform Scan Results" >> scan-results/summary.md
          if [ -f "scan-results/results_terraform.txt" ]; then
            cat scan-results/results_terraform.txt >> scan-results/summary.md
          else
            echo "No results found. Either no files of this type exist or all checks passed." >> scan-results/summary.md
          fi
          echo "---" >> scan-results/summary.md
          
          echo "## Helm Chart Scan Results" >> scan-results/summary.md
          find scan-results -name "helm-*" -type d | while read dir; do
            chart_name=$(basename "$dir" | sed 's/helm-//')
            echo "### $chart_name" >> scan-results/summary.md
            if [ -f "$dir/results_kubernetes.txt" ]; then
              cat "$dir/results_kubernetes.txt" >> scan-results/summary.md
            else
              echo "No issues found for this chart." >> scan-results/summary.md
            fi
          done
          echo "---" >> scan-results/summary.md
          
          echo "## Source Code Security Results" >> scan-results/summary.md
          if [ -f "scan-results/semgrep.json" ]; then
            semgrep_issues=$(jq '.results | length' scan-results/semgrep.json)
            echo "Semgrep found $semgrep_issues potential issues." >> scan-results/summary.md
          else
            echo "No Semgrep results available." >> scan-results/summary.md
          fi
          echo "---" >> scan-results/summary.md
          
          echo "## Overall Results (All Frameworks)" >> scan-results/summary.md
          if [ -f "scan-results/results.txt" ]; then
            cat scan-results/results.txt >> scan-results/summary.md
          else
            echo "No comprehensive scan results available." >> scan-results/summary.md
          fi
          echo "---" >> scan-results/summary.md
          
          # Print summary
          echo "============================"
          echo "SECURITY SCAN RESULTS"
          echo "============================"
          echo "Total HIGH/CRITICAL severity issues: $high_issues"
          
          if [ $high_issues -gt 0 ]; then
            echo "❌ $high_issues HIGH/CRITICAL severity issues found. See scan-results/high-severity.md for details."
            exit 1
          else
            echo "✅ No HIGH/CRITICAL severity issues found."
            echo "Complete scan results available in scan-results/summary.md"
          fi
          echo "============================"
      
      - name: Upload Security Scan Results
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results
          path: scan-results/
