name: IaC Security Scan

# Trigger on push to main branches, pull requests, weekly, or manually
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan on Sundays
  workflow_dispatch:  # Manual trigger option

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper commit analysis
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install checkov tfsec
          pip install semgrep
          
          # Install Trivy for IaC scanning
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.45.1
          
          # Install terrascan
          curl -L "$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest | grep -o -E "https://.+?_Linux_x86_64.tar.gz")" > terrascan.tar.gz
          tar -xf terrascan.tar.gz terrascan && rm terrascan.tar.gz
          sudo mv terrascan /usr/local/bin/ && sudo chmod +x /usr/local/bin/terrascan
          
          # Install kube-linter
          curl -L "https://github.com/stackrox/kube-linter/releases/download/v0.6.5/kube-linter-linux.tar.gz" | tar -xz
          sudo mv kube-linter /usr/local/bin/
      
      - name: Auto-detect IaC files
        id: detect-files
        shell: bash
        run: |
          echo "Detecting infrastructure as code files..."
          
          # Kubernetes manifests detection
          k8s_files=$(find . -type f \( -name "*.yaml" -o -name "*.yml" \) | grep -v "node_modules" | grep -v "helm" | grep -v "Chart.yaml" | grep -v "values.yaml" || echo "")
          if [ -n "$k8s_files" ]; then
            k8s_count=$(echo "$k8s_files" | grep -v "^$" | wc -l)
          else
            k8s_count=0
          fi
          echo "K8S_COUNT=$k8s_count" >> $GITHUB_ENV
          echo "Found $k8s_count Kubernetes manifest files"
          
          # Dockerfile detection
          docker_files=$(find . -type f -name "Dockerfile*" | grep -v "node_modules" || echo "")
          if [ -n "$docker_files" ]; then
            docker_count=$(echo "$docker_files" | grep -v "^$" | wc -l)
          else
            docker_count=0
          fi
          echo "DOCKER_COUNT=$docker_count" >> $GITHUB_ENV
          echo "Found $docker_count Dockerfiles"
          
          # Terraform detection
          tf_files=$(find . -type f -name "*.tf" | grep -v "node_modules" || echo "")
          if [ -n "$tf_files" ]; then
            tf_count=$(echo "$tf_files" | grep -v "^$" | wc -l)
          else
            tf_count=0
          fi
          echo "TF_COUNT=$tf_count" >> $GITHUB_ENV
          echo "Found $tf_count Terraform files"
          
          # Helm chart detection
          helm_dirs=$(find . -type f -name "Chart.yaml" | xargs -L1 dirname 2>/dev/null || echo "")
          if [ -n "$helm_dirs" ]; then
            helm_count=$(echo "$helm_dirs" | grep -v "^$" | wc -l)
          else
            helm_count=0
          fi
          echo "HELM_COUNT=$helm_count" >> $GITHUB_ENV
          echo "Found $helm_count Helm charts"
          
          # CloudFormation detection
          cf_files=$(find . -type f \( -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) -exec grep -l "AWSTemplateFormatVersion\|Resources" {} \; || echo "")
          if [ -n "$cf_files" ]; then
            cf_count=$(echo "$cf_files" | grep -v "^$" | wc -l)
          else
            cf_count=0
          fi
          echo "CF_COUNT=$cf_count" >> $GITHUB_ENV
          echo "Found $cf_count CloudFormation files"
          
          # Ansible detection
          ansible_files=$(find . -type f \( -name "*.yaml" -o -name "*.yml" \) -path "*/playbooks/*" -o -path "*/roles/*" || echo "")
          if [ -n "$ansible_files" ]; then
            ansible_count=$(echo "$ansible_files" | grep -v "^$" | wc -l)
          else
            ansible_count=0
          fi
          echo "ANSIBLE_COUNT=$ansible_count" >> $GITHUB_ENV
          echo "Found $ansible_count Ansible files"
          
          # Create results directory
          mkdir -p scan-results
      
      # Kubernetes Manifests Scanning
      - name: Scan Kubernetes Manifests
        if: env.K8S_COUNT > 0
        id: k8s-scan
        shell: bash
        run: |
          echo "# Kubernetes Security Scan Results" > scan-results/kubernetes.md
          echo "## Checkov Results" >> scan-results/kubernetes.md
          
          # Run Checkov on Kubernetes files
          checkov -d . --framework kubernetes --output cli --output-file-path scan-results/ || true
          
          # Run kube-linter
          mkdir -p scan-results/kube-linter
          find . -type f \( -name "*.yaml" -o -name "*.yml" \) -not -path "*/\.*" -not -path "*/node_modules/*" | \
            xargs -I{} sh -c 'kube-linter lint {} > scan-results/kube-linter/$(basename {}).txt 2>&1 || true'
          
          # Run Trivy config scan
          mkdir -p scan-results/trivy-k8s
          find . -type f \( -name "*.yaml" -o -name "*.yml" \) -not -path "*/\.*" -not -path "*/node_modules/*" | \
            xargs -I{} sh -c 'trivy config --security-checks=config {} -o scan-results/trivy-k8s/$(basename {}).txt || true'
      
      # Dockerfile Scanning
      - name: Scan Dockerfiles
        if: env.DOCKER_COUNT > 0
        id: docker-scan
        shell: bash
        run: |
          echo "# Dockerfile Security Scan Results" > scan-results/dockerfile.md
          echo "## Checkov Results" >> scan-results/dockerfile.md
          
          # Run Checkov on Dockerfiles
          checkov -d . --framework dockerfile --output cli --output-file-path scan-results/ || true
          
          # Run Trivy config scan on Dockerfiles
          mkdir -p scan-results/trivy-dockerfile
          find . -type f -name "Dockerfile*" -not -path "*/\.*" -not -path "*/node_modules/*" | \
            xargs -I{} sh -c 'trivy config --security-checks=config {} -o scan-results/trivy-dockerfile/$(basename {}).txt || true'
      
      # Terraform Scanning
      - name: Scan Terraform Files
        if: env.TF_COUNT > 0
        id: terraform-scan
        shell: bash
        run: |
          echo "# Terraform Security Scan Results" > scan-results/terraform.md
          
          # Run Checkov on Terraform files
          echo "## Checkov Results" >> scan-results/terraform.md
          checkov -d . --framework terraform --output cli --output-file-path scan-results/ || true
          
          # Run tfsec
          echo "## TFSec Results" >> scan-results/terraform.md
          mkdir -p scan-results/tfsec
          tfsec . --format json > scan-results/tfsec/results.json || true
          
          # Run terrascan
          echo "## Terrascan Results" >> scan-results/terraform.md
          mkdir -p scan-results/terrascan
          terrascan scan -t terraform -o json > scan-results/terrascan/results.json || true
          
          # Run Trivy config scan on Terraform files
          mkdir -p scan-results/trivy-terraform
          find . -type f -name "*.tf" -not -path "*/\.*" -not -path "*/node_modules/*" | \
            xargs -I{} sh -c 'trivy config --security-checks=config {} -o scan-results/trivy-terraform/$(basename {}).txt || true'
      
      # Helm Chart Scanning
      - name: Scan Helm Charts
        if: env.HELM_COUNT > 0
        id: helm-scan
        shell: bash
        run: |
          echo "# Helm Chart Security Scan Results" > scan-results/helm.md
          echo "## Checkov Results" >> scan-results/helm.md
          
          # Install Helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          # For each Helm chart
          find . -name "Chart.yaml" -exec dirname {} \; | while read chart_dir; do
            chart_name=$(basename "$chart_dir")
            echo "Processing Helm chart: $chart_name"
            
            # Create temporary directory for rendered templates
            temp_dir=$(mktemp -d)
            
            # Try to render templates with default values
            helm template "$chart_name" "$chart_dir" --output-dir "$temp_dir" > /dev/null 2>&1 || true
            
            # Scan rendered templates if successful
            if [ -d "$temp_dir/$chart_name" ]; then
              # Scan with Checkov
              checkov -d "$temp_dir" --framework kubernetes --output cli --output-file-path "scan-results/helm-$chart_name" || true
              
              # Scan with kube-linter
              find "$temp_dir" -type f \( -name "*.yaml" -o -name "*.yml" \) | \
                xargs -I{} sh -c 'kube-linter lint {} > scan-results/kube-linter/helm-$(basename {}).txt 2>&1 || true'
              
              # Scan with Trivy
              find "$temp_dir" -type f \( -name "*.yaml" -o -name "*.yml" \) | \
                xargs -I{} sh -c 'trivy config --security-checks=config {} -o scan-results/trivy-helm/$(basename {}).txt || true'
            else
              echo "Failed to render templates for $chart_name" >> scan-results/helm.md
            fi
            
            # Clean up
            rm -rf "$temp_dir"
          done
      
      # CloudFormation Scanning
      - name: Scan CloudFormation Files
        if: env.CF_COUNT > 0
        id: cf-scan
        shell: bash
        run: |
          echo "# CloudFormation Security Scan Results" > scan-results/cloudformation.md
          echo "## Checkov Results" >> scan-results/cloudformation.md
          
          # Run Checkov on CloudFormation files
          checkov -d . --framework cloudformation --output cli --output-file-path scan-results/ || true
          
          # Run Trivy config scan on CloudFormation files
          mkdir -p scan-results/trivy-cf
          find . -type f \( -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) -exec grep -l "AWSTemplateFormatVersion\|Resources" {} \; | \
            xargs -I{} sh -c 'trivy config --security-checks=config {} -o scan-results/trivy-cf/$(basename {}).txt || true'
      
      # Ansible Scanning
      - name: Scan Ansible Files
        if: env.ANSIBLE_COUNT > 0
        id: ansible-scan
        shell: bash
        run: |
          echo "# Ansible Security Scan Results" > scan-results/ansible.md
          echo "## Checkov Results" >> scan-results/ansible.md
          
          # Run Checkov on Ansible files
          checkov -d . --framework ansible --output cli --output-file-path scan-results/ || true
      
      # Generate consolidated report
      - name: Generate Consolidated Report
        id: generate-report
        shell: bash
        run: |
          echo "# IaC Security Scan Summary" > scan-results/summary.md
          echo "Scan completed at $(date)" >> scan-results/summary.md
          echo "## Files Scanned" >> scan-results/summary.md
          echo "- Kubernetes Manifests: $K8S_COUNT" >> scan-results/summary.md
          echo "- Dockerfiles: $DOCKER_COUNT" >> scan-results/summary.md
          echo "- Terraform Files: $TF_COUNT" >> scan-results/summary.md
          echo "- Helm Charts: $HELM_COUNT" >> scan-results/summary.md
          echo "- CloudFormation Files: $CF_COUNT" >> scan-results/summary.md
          echo "- Ansible Files: $ANSIBLE_COUNT" >> scan-results/summary.md
          
          # Count issues by severity
          critical_count=0
          high_count=0
          medium_count=0
          
          # Process checkov results
          checkov_results=$(find scan-results -name "results_*.txt" -type f)
          if [ -n "$checkov_results" ]; then
            critical_checkov=$(grep -c "CRITICAL" $checkov_results || echo 0)
            high_checkov=$(grep -c "HIGH" $checkov_results || echo 0)
            medium_checkov=$(grep -c "MEDIUM" $checkov_results || echo 0)
            
            critical_count=$((critical_count + critical_checkov))
            high_count=$((high_count + high_checkov))
            medium_count=$((medium_count + medium_checkov))
          fi
          
          # Extract issues from tfsec if exists
          if [ -f "scan-results/tfsec/results.json" ]; then
            critical_tfsec=$(jq '.results | map(select(.severity == "CRITICAL")) | length' scan-results/tfsec/results.json 2>/dev/null || echo 0)
            high_tfsec=$(jq '.results | map(select(.severity == "HIGH")) | length' scan-results/tfsec/results.json 2>/dev/null || echo 0)
            medium_tfsec=$(jq '.results | map(select(.severity == "MEDIUM")) | length' scan-results/tfsec/results.json 2>/dev/null || echo 0)
            
            critical_count=$((critical_count + critical_tfsec))
            high_count=$((high_count + high_tfsec))
            medium_count=$((medium_count + medium_tfsec))
          fi
          
          # Add summary to report
          echo "## Security Issues Summary" >> scan-results/summary.md
          echo "- Critical Issues: $critical_count" >> scan-results/summary.md
          echo "- High Issues: $high_count" >> scan-results/summary.md
          echo "- Medium Issues: $medium_count" >> scan-results/summary.md
          
          # Set status based on findings
          if [ $critical_count -gt 0 ]; then
            echo "❌ Critical security issues found!" >> scan-results/summary.md
            echo "SCAN_STATUS=FAILED" >> $GITHUB_ENV
          elif [ $high_count -gt 0 ]; then
            echo "⚠️ High security issues found!" >> scan-results/summary.md
            echo "SCAN_STATUS=WARNING" >> $GITHUB_ENV
          else
            echo "✅ No critical or high security issues found." >> scan-results/summary.md
            echo "SCAN_STATUS=PASSED" >> $GITHUB_ENV
          fi
      
      # Upload scan results
      - name: Upload Security Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: scan-results/
          retention-days: 90
      
      # Create GitHub issues for critical findings (optional)
      - name: Create GitHub Issues for Critical Findings
        if: env.SCAN_STATUS == 'FAILED'
        run: |
          echo "Creating GitHub issues for critical findings..."
          # This is a placeholder for GitHub issue creation
          # You can implement this using GitHub CLI or API calls
      
      # Fail the workflow if critical issues are found
      - name: Check scan status
        run: |
          if [ "$SCAN_STATUS" == "FAILED" ]; then
            echo "Critical security issues found in IaC files!"
            exit 1
          elif [ "$SCAN_STATUS" == "WARNING" ]; then
            echo "High security issues found in IaC files. Please review."
            exit 0
          else
            echo "No critical or high security issues found."
            exit 0
          fi
