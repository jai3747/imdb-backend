# GitHub Actions workflow for comprehensive Infrastructure as Code security scanning
name: IaC Security Scan

on:
  # Run on every push to any branch
  push:
  # Run on pull requests to main/master branches
  pull_request:
    branches: [ main, master ]
  # Option to run manually from the Actions tab
  workflow_dispatch:

jobs:
  security-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Fetch all history for proper scanning
      
      # Debug: List all infrastructure files in the repository
      - name: List IaC files
        run: |
          echo "Looking for all infrastructure files in the repository:"
          echo "Kubernetes manifests:"
          find . -type f -name "*.yaml" -o -name "*.yml" | grep -v "/.git/" | sort
          echo "---"
          echo "Dockerfiles:"
          find . -type f -name "Dockerfile*" | grep -v "/.git/" | sort
          echo "---"
          echo "Terraform files:"
          find . -type f -name "*.tf" -o -name "*.tfvars" | grep -v "/.git/" | sort
          echo "---"
          echo "Helm charts:"
          find . -name "Chart.yaml" | grep -v "/.git/" | sort
          echo "---"
          
      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
          
      - name: Install Checkov
        run: pip install checkov
      
      # Create directory for results
      - name: Prepare results directory
        run: |
          rm -rf scan-results || true
          mkdir -p scan-results/kubernetes
          mkdir -p scan-results/docker
          mkdir -p scan-results/terraform
          mkdir -p scan-results/helm
          mkdir -p scan-results/full
      
      # Specialized scans for each file type
      - name: Scan Kubernetes manifests
        run: |
          # Count how many Kubernetes files we have
          K8S_COUNT=$(find . -type f -name "*.yaml" -o -name "*.yml" | grep -v "/.git/" | grep -v "/helm/" | wc -l)
          
          if [ "$K8S_COUNT" -gt 0 ]; then
            echo "Found $K8S_COUNT Kubernetes manifest files to scan"
            checkov --directory . --framework kubernetes --output cli --download-external-modules true > scan-results/kubernetes/k8s-results.txt || true
            echo "Kubernetes scan completed"
          else
            echo "No Kubernetes manifest files found"
            echo "No Kubernetes manifest files found" > scan-results/kubernetes/k8s-results.txt
          fi
      
      - name: Scan Dockerfiles
        run: |
          # Count how many Dockerfiles we have
          DOCKER_COUNT=$(find . -type f -name "Dockerfile*" | grep -v "/.git/" | wc -l)
          
          if [ "$DOCKER_COUNT" -gt 0 ]; then
            echo "Found $DOCKER_COUNT Dockerfiles to scan"
            checkov --directory . --framework dockerfile --output cli --download-external-modules true > scan-results/docker/docker-results.txt || true
            echo "Docker scan completed"
          else
            echo "No Dockerfiles found"
            echo "No Dockerfiles found" > scan-results/docker/docker-results.txt
          fi
      
      - name: Scan Terraform files
        run: |
          # Count how many Terraform files we have
          TF_COUNT=$(find . -type f -name "*.tf" -o -name "*.tfvars" | grep -v "/.git/" | wc -l)
          
          if [ "$TF_COUNT" -gt 0 ]; then
            echo "Found $TF_COUNT Terraform files to scan"
            checkov --directory . --framework terraform --output cli --download-external-modules true > scan-results/terraform/terraform-results.txt || true
            echo "Terraform scan completed"
          else
            echo "No Terraform files found"
            echo "No Terraform files found" > scan-results/terraform/terraform-results.txt
          fi
      
      - name: Scan Helm charts
        run: |
          # Count how many Helm charts we have
          HELM_COUNT=$(find . -name "Chart.yaml" | grep -v "/.git/" | wc -l)
          
          if [ "$HELM_COUNT" -gt 0 ]; then
            echo "Found $HELM_COUNT Helm charts to scan"
            checkov --directory . --framework helm --output cli --download-external-modules true > scan-results/helm/helm-results.txt || true
            echo "Helm scan completed"
          else
            echo "No Helm charts found"
            echo "No Helm charts found" > scan-results/helm/helm-results.txt
          fi
      
      # Run a comprehensive scan for all frameworks
      - name: Run comprehensive scan
        run: |
          # Run Checkov with ALL frameworks
          checkov --directory . --output cli --download-external-modules true > scan-results/full/all-results.txt || true
          
          if [ -s scan-results/full/all-results.txt ]; then
            echo "Comprehensive scan completed successfully"
          else
            echo "Comprehensive scan did not produce results"
            echo "No IaC files found or scan failed." > scan-results/full/all-results.txt
          fi
      
      # Create a detailed summary report
      - name: Create scan summary
        run: |
          # Create the summary markdown file
          echo "# Infrastructure as Code Security Scan Results" > scan-results/summary.md
          echo "Scan completed at $(date)" >> scan-results/summary.md
          echo "" >> scan-results/summary.md
          
          # Function to extract check results for each framework
          extract_results() {
            local file="$1"
            local title="$2"
            
            echo "## $title" >> scan-results/summary.md
            
            if [ -s "$file" ] && grep -q "Check Results Summary" "$file"; then
              # Extract summary stats
              echo "### Summary" >> scan-results/summary.md
              echo '```' >> scan-results/summary.md
              grep -A 3 "Check Results Summary" "$file" | head -n 4 >> scan-results/summary.md
              echo '```' >> scan-results/summary.md
              echo "" >> scan-results/summary.md
              
              # Check if there are any failures
              if grep -q "Failed checks:" "$file" && ! grep -q "Failed checks: 0" "$file"; then
                echo "### Failed Checks" >> scan-results/summary.md
                echo "" >> scan-results/summary.md
                
                # Extract failed checks with their details
                grep -A 4 "FAILED" "$file" | grep -v "PASSED" | sed 's/^/    /' >> scan-results/summary.md
                echo "" >> scan-results/summary.md
              else
                echo "### No Failed Checks! 🎉" >> scan-results/summary.md
                echo "" >> scan-results/summary.md
              fi
            else
              echo "No results found. Either no files of this type exist or all checks passed." >> scan-results/summary.md
              echo "" >> scan-results/summary.md
            fi
            
            echo "---" >> scan-results/summary.md
            echo "" >> scan-results/summary.md
          }
          
          # Process each result file
          extract_results "scan-results/kubernetes/k8s-results.txt" "Kubernetes Scan Results"
          extract_results "scan-results/docker/docker-results.txt" "Docker Scan Results"
          extract_results "scan-results/terraform/terraform-results.txt" "Terraform Scan Results"
          extract_results "scan-results/helm/helm-results.txt" "Helm Chart Scan Results"
          
          # Add comprehensive scan results last
          echo "## Overall Results (All Frameworks)" >> scan-results/summary.md
          echo "" >> scan-results/summary.md
          
          if [ -s "scan-results/full/all-results.txt" ] && grep -q "Check Results Summary" "scan-results/full/all-results.txt"; then
            # Extract overall summary
            echo "### Summary" >> scan-results/summary.md
            echo '```' >> scan-results/summary.md
            grep -A 3 "Check Results Summary" "scan-results/full/all-results.txt" | head -n 4 >> scan-results/summary.md
            echo '```' >> scan-results/summary.md
          else
            echo "No comprehensive scan results available." >> scan-results/summary.md
          fi
          
          # Print summary to console
          echo "--- Summary Report Preview ---"
          head -n 30 scan-results/summary.md
          echo "---"
      
      # Create separate report of high severity issues
      - name: Extract high severity issues
        run: |
          echo "# HIGH Severity Security Issues" > scan-results/high-severity.md
          echo "Generated at $(date)" >> scan-results/high-severity.md
          echo "" >> scan-results/high-severity.md
          
          # Function to extract high severity issues
          extract_high_severity() {
            local file="$1"
            local title="$2"
            
            if [ -s "$file" ] && grep -q "HIGH" "$file"; then
              echo "## $title - HIGH Severity Issues" >> scan-results/high-severity.md
              echo "" >> scan-results/high-severity.md
              
              # Extract lines containing HIGH and the 3 lines after them
              grep -B 1 -A 3 "HIGH" "$file" >> scan-results/high-severity.md
              
              echo "" >> scan-results/high-severity.md
              echo "---" >> scan-results/high-severity.md
              echo "" >> scan-results/high-severity.md
              
              return 0  # Found high severity issues
            fi
            
            return 1  # No high severity issues
          }
          
          # Process each result file
          high_found=0
          
          if extract_high_severity "scan-results/kubernetes/k8s-results.txt" "Kubernetes"; then
            high_found=1
          fi
          
          if extract_high_severity "scan-results/docker/docker-results.txt" "Docker"; then
            high_found=1
          fi
          
          if extract_high_severity "scan-results/terraform/terraform-results.txt" "Terraform"; then
            high_found=1
          fi
          
          if extract_high_severity "scan-results/helm/helm-results.txt" "Helm"; then
            high_found=1
          fi
          
          # If no high severity issues were found
          if [ $high_found -eq 0 ]; then
            echo "## No HIGH Severity Issues Found! 🎉" >> scan-results/high-severity.md
          fi
      
      # Report findings
      - name: Report security issues
        run: |
          # Count total number of failed checks
          TOTAL_FAILED=$(grep -c "FAILED" scan-results/full/all-results.txt || echo "0")
          HIGH_SEVERITY=$(grep -c "HIGH" scan-results/full/all-results.txt || echo "0")
          
          echo "=========================="
          echo "SECURITY SCAN RESULTS"
          echo "=========================="
          echo "Total failed checks: $TOTAL_FAILED"
          echo "HIGH severity issues: $HIGH_SEVERITY"
          
          if [ "$HIGH_SEVERITY" -gt 0 ]; then
            echo "⚠️ WARNING: HIGH severity security issues found!"
            echo "Please review scan-results/high-severity.md for details."
          else
            echo "✅ No HIGH severity issues found."
          fi
          
          echo "Complete scan results available in scan-results/summary.md"
          echo "=========================="
