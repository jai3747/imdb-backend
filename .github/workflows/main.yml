name: IaC Security Scan

# Trigger on push to main branches, pull requests, weekly, or manually
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan on Sundays
  workflow_dispatch:  # Manual trigger option

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper commit analysis
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install checkov trivy-scanner semgrep bandit
          # Install kube-score
          curl -Lo kube-score.tar.gz https://github.com/zegl/kube-score/releases/latest/download/kube-score_1.16.1_linux_amd64.tar.gz
          tar -xzf kube-score.tar.gz && chmod +x kube-score && sudo mv kube-score /usr/local/bin/
          # Install kubesec
          curl -Lo kubesec.tar.gz https://github.com/controlplaneio/kubesec/releases/latest/download/kubesec_linux_amd64.tar.gz
          tar -xzf kubesec.tar.gz && chmod +x kubesec && sudo mv kubesec /usr/local/bin/
          # Install Trivy
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.42.0
          # Install tfsec for Terraform scanning
          curl -Lo tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.1/tfsec-linux-amd64
          chmod +x tfsec && sudo mv tfsec /usr/local/bin/
          # Install jq for JSON processing
          sudo apt-get update && sudo apt-get install -y jq

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      
      - name: Create scan results directory
        run: mkdir -p scan-results
      
      - name: Auto-detect IaC files
        id: detect-files
        run: |
          echo "Detecting infrastructure as code files..."
          
          # Kubernetes manifests detection
          k8s_files=$(find . -type f -name "*.yaml" -o -name "*.yml" | grep -v "node_modules" | grep -v "helm" | grep -v "Chart.yaml" | grep -v "values.yaml")
          k8s_count=$(echo "$k8s_files" | grep -v "^$" | wc -l)
          echo "K8S_COUNT=$k8s_count" >> $GITHUB_ENV
          echo "Found $k8s_count Kubernetes manifest files"
          
          # Dockerfile detection
          docker_files=$(find . -type f -name "Dockerfile*" | grep -v "node_modules")
          docker_count=$(echo "$docker_files" | grep -v "^$" | wc -l)
          echo "DOCKER_COUNT=$docker_count" >> $GITHUB_ENV
          echo "Found $docker_count Dockerfiles"
          
          # Terraform detection
          tf_files=$(find . -type f -name "*.tf" | grep -v "node_modules")
          tf_count=$(echo "$tf_files" | grep -v "^$" | wc -l)
          echo "TF_COUNT=$tf_count" >> $GITHUB_ENV
          echo "Found $tf_count Terraform files"
          
          # Helm chart detection
          helm_dirs=$(find . -type f -name "Chart.yaml" | xargs -L1 dirname 2>/dev/null || echo "")
          helm_count=$(echo "$helm_dirs" | grep -v "^$" | wc -l)
          echo "HELM_COUNT=$helm_count" >> $GITHUB_ENV
          echo "Found $helm_count Helm charts"
          
          # List all detected Helm charts for later steps
          if [ $helm_count -gt 0 ]; then
            echo "HELM_DIRS<<EOF" >> $GITHUB_ENV
            echo "$helm_dirs" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
      
      # Prepare Helm values files for charts
      - name: Prepare Helm values
        if: env.HELM_COUNT > 0
        run: |
          # Create helm-values directory for custom values files
          mkdir -p ./helm-values
          
          # For each Helm chart, create a basic values file
          echo "$HELM_DIRS" | while read -r chart_dir; do
            if [ -z "$chart_dir" ]; then continue; fi
            
            chart_name=$(basename "$chart_dir")
            echo "Creating default values file for chart: $chart_name"
            
            # Create a basic values file - Using echo instead of heredoc
            echo "# Auto-generated values file for chart" > "./helm-values/${chart_name}-values.yaml"
            echo "global:" >> "./helm-values/${chart_name}-values.yaml"
            echo "  namespace: default" >> "./helm-values/${chart_name}-values.yaml" 
            echo "  environment: development" >> "./helm-values/${chart_name}-values.yaml"
            
            # If a values.yaml exists, analyze structure
            if [ -f "$chart_dir/values.yaml" ]; then
              echo "Existing values.yaml found, analyzing structure..."
              template_dirs=$(find "$chart_dir/templates" -type f -name "*.yaml" -o -name "*.yml" -o -name "*.tpl" 2>/dev/null || echo "")
              
              if [ -n "$template_dirs" ]; then
                echo "Analyzing templates for required values..."
                for template in $template_dirs; do
                  # Look for Values references that might be required
                  grep -o '\.Values\.[a-zA-Z0-9_.]*' "$template" 2>/dev/null | sort -u | while read -r value_ref; do
                    # Extract the value path without .Values.
                    value_path=$(echo "$value_ref" | sed 's/\.Values\.//')
                    
                    # Skip global namespace as we already added it
                    if [ "$value_path" == "global.namespace" ]; then continue; fi
                    
                    # Add the value if it doesn't exist
                    if ! grep -q "$value_path:" "./helm-values/${chart_name}-values.yaml"; then
                      # Split the path into components
                      IFS='.' read -ra path_parts <<< "$value_path"
                      
                      # Generate the YAML structure
                      indent=""
                      current_path=""
                      for i in "${!path_parts[@]}"; do
                        part=${path_parts[$i]}
                        
                        # Last part gets a placeholder value
                        if [ $i -eq $((${#path_parts[@]} - 1)) ]; then
                          echo "${indent}${part}: placeholder-value" >> "./helm-values/${chart_name}-values.yaml"
                        else
                          # Check if this part of the path already exists
                          current_path="${current_path}${part}"
                          if ! grep -q "^${indent}${part}:" "./helm-values/${chart_name}-values.yaml"; then
                            echo "${indent}${part}:" >> "./helm-values/${chart_name}-values.yaml"
                          fi
                          indent="${indent}  "
                          current_path="${current_path}."
                        fi
                      done
                    fi
                  done
                done
              fi
            fi
          done
          
          # List generated values files
          echo "Generated Helm values files:"
          ls -la ./helm-values/
      
      # Kubernetes Manifests Scanning
      - name: Scan Kubernetes Manifests
        if: env.K8S_COUNT > 0
        id: k8s-scan
        run: |
          echo "# Kubernetes Security Scan Results" > scan-results/kubernetes.md
          echo "## Checkov Results" >> scan-results/kubernetes.md
          
          # Run Checkov on Kubernetes files
          checkov -d . --framework kubernetes --output cli --output-file-path scan-results/ || true
          
          # Run KubeScore on each file
          k8s_files=$(find . -type f -name "*.yaml" -o -name "*.yml" | grep -v "node_modules" | grep -v "helm" | grep -v "Chart.yaml" | grep -v "values.yaml")
          echo "$k8s_files" | while read -r file; do
            if [ -z "$file" ]; then continue; fi
            echo "Scanning $file with kube-score"
            kube-score score "$file" >> scan-results/kubescore.txt 2>/dev/null || true
          done
          
          # Run KubeSec on each file
          echo "$k8s_files" | while read -r file; do
            if [ -z "$file" ]; then continue; fi
            echo "Scanning $file with kubesec"
            kubesec scan "$file" 2>/dev/null >> scan-results/kubesec.json || true
          done
      
      # Docker Scanning
      - name: Scan Dockerfiles and Images
        if: env.DOCKER_COUNT > 0
        id: docker-scan
        run: |
          echo "# Docker Security Scan Results" > scan-results/docker.md
          echo "## Checkov Results" >> scan-results/docker.md
          
          # Run Checkov on Dockerfiles
          checkov -d . --framework dockerfile --output cli --output-file-path scan-results/ || true
          
          # Run Trivy on Dockerfiles
          docker_files=$(find . -type f -name "Dockerfile*" | grep -v "node_modules")
          echo "$docker_files" | while read -r file; do
            if [ -z "$file" ]; then continue; fi
            dir=$(dirname "$file")
            echo "Scanning $file with Trivy"
            trivy config "$file" --severity HIGH,CRITICAL --output scan-results/trivy-dockerfile-$(basename "$dir").txt || true
          done
          
          # Scan Docker images if docker-compose exists
          if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            echo "Extracting images from docker-compose files"
            compose_files=$(find . -name "docker-compose*.yml" -o -name "docker-compose*.yaml")
            
            for compose_file in $compose_files; do
              echo "Processing $compose_file"
              images=$(grep -E "image:.*" "$compose_file" | awk '{print $2}' | sort -u)
              
              for image in $images; do
                # Skip empty or invalid images
                if [ -z "$image" ] || [[ "$image" == *"${"* ]]; then continue; fi
                
                echo "Scanning Docker image: $image"
                # Try to pull the image first
                docker pull "$image" >/dev/null 2>&1 || true
                
                # Scan the image if pull successful
                if docker image inspect "$image" >/dev/null 2>&1; then
                  trivy image "$image" --severity HIGH,CRITICAL --output "scan-results/trivy-image-$(echo "$image" | tr '/:' '__').txt" || true
                else
                  echo "Unable to pull image $image, skipping scan"
                fi
              done
            done
          fi
      
      # Terraform Scanning
      - name: Scan Terraform Files
        if: env.TF_COUNT > 0
        id: terraform-scan
        run: |
          echo "# Terraform Security Scan Results" > scan-results/terraform.md
          echo "## Checkov Results" >> scan-results/terraform.md
          
          # Run Checkov on Terraform files
          checkov -d . --framework terraform --output cli --output-file-path scan-results/ || true
          
          # Run tfsec
          tfsec . --format json > scan-results/tfsec.json || true
      
      # Helm Chart Scanning
      - name: Scan Helm Charts
        if: env.HELM_COUNT > 0
        id: helm-scan
        run: |
          echo "# Helm Chart Security Scan Results" > scan-results/helm.md
          echo "## Checkov Results" >> scan-results/helm.md
          
          # Process each Helm chart
          echo "$HELM_DIRS" | while read -r chart_dir; do
            if [ -z "$chart_dir" ]; then continue; fi
            
            chart_name=$(basename "$chart_dir")
            echo "Processing Helm chart: $chart_name in $chart_dir"
            
            # Create temporary directory for rendered templates
            temp_dir=$(mktemp -d)
            
            # Check if custom values file exists
            values_file="./helm-values/${chart_name}-values.yaml"
            values_arg=""
            if [ -f "$values_file" ]; then
              values_arg="--values $values_file"
              echo "Using custom values file: $values_file"
            fi
            
            # Try to render templates
            echo "Attempting to render Helm templates for $chart_name"
            helm template "$chart_name" "$chart_dir" $values_arg --output-dir "$temp_dir" > "scan-results/helm-template-$chart_name.log" 2>&1 || true
            
            # If first attempt fails, try with additional values
            if [ ! -f "$temp_dir/$chart_name/templates/_helpers.tpl" ] && [ -f "$chart_dir/templates/_helpers.tpl" ]; then
              echo "First template attempt failed, trying with additional default values"
              helm template "$chart_name" "$chart_dir" $values_arg --set global.namespace=default --output-dir "$temp_dir" > "scan-results/helm-template-$chart_name-retry.log" 2>&1 || true
            fi
            
            # Check if templates were generated
            template_files=$(find "$temp_dir" -type f -name "*.yaml" -o -name "*.yml" 2>/dev/null || echo "")
            template_count=$(echo "$template_files" | grep -v "^$" | wc -l)
            
            if [ $template_count -gt 0 ]; then
              echo "Successfully rendered $template_count templates for $chart_name"
              
              # Scan rendered templates with checkov
              checkov -d "$temp_dir" --framework kubernetes --output cli --output-file-path "scan-results/helm-$chart_name" || true
              
              # Scan rendered templates with kubesec
              for file in $template_files; do
                if [ -z "$file" ]; then continue; fi
                kubesec scan "$file" >> "scan-results/kubesec-helm-$chart_name.json" 2>/dev/null || true
              done
              
              # Scan rendered templates with kube-score
              find "$temp_dir" -type f -name "*.yaml" -o -name "*.yml" | xargs -L1 kube-score score >> "scan-results/kubescore-helm-$chart_name.txt" 2>/dev/null || true
            else
              echo "Failed to render templates for $chart_name. Check logs for details."
              
              # Extract error information from logs
              if grep -q "nil pointer evaluating" "scan-results/helm-template-$chart_name.log"; then
                echo "DETECTED NIL POINTER ERROR - Missing values in Helm chart"
                
                # Try to extract the specific missing value
                missing_value=$(grep "nil pointer evaluating" "scan-results/helm-template-$chart_name.log" | grep -o '<.*>' | head -1)
                if [ -n "$missing_value" ]; then
                  echo "Missing value detected: $missing_value"
                  # Add the missing value to values file
                  missing_path=$(echo "$missing_value" | sed 's/<\.Values\.//' | sed 's/>$//')
                  echo "Adding missing path: $missing_path to values file"
                  
                  # Create YAML structure
                  IFS='.' read -ra path_parts <<< "$missing_path"
                  indent=""
                  for i in "${!path_parts[@]}"; do
                    part=${path_parts[$i]}
                    
                    # Last part gets a placeholder value
                    if [ $i -eq $((${#path_parts[@]} - 1)) ]; then
                      echo "${indent}${part}: default-value" >> "$values_file"
                    else
                      # Check if this part already exists
                      if ! grep -q "^${indent}${part}:" "$values_file"; then
                        echo "${indent}${part}:" >> "$values_file"
                      fi
                      indent="${indent}  "
                    fi
                  done
                  
                  # Retry template rendering
                  echo "Retrying template rendering with updated values"
                  helm template "$chart_name" "$chart_dir" --values "$values_file" --output-dir "$temp_dir" > "scan-results/helm-template-$chart_name-retry2.log" 2>&1 || true
                  
                  # Check if second attempt worked
                  template_files=$(find "$temp_dir" -type f -name "*.yaml" -o -name "*.yml" 2>/dev/null || echo "")
                  template_count=$(echo "$template_files" | grep -v "^$" | wc -l)
                  
                  if [ $template_count -gt 0 ]; then
                    echo "Successfully rendered templates on retry"
                    checkov -d "$temp_dir" --framework kubernetes --output cli --output-file-path "scan-results/helm-$chart_name" || true
                  else
                    echo "Still unable to render templates after retry"
                  fi
                fi
              fi
            fi
            
            # Clean up temp directory
            rm -rf "$temp_dir"
          done
      
      # Source Code Security Scanning
      - name: Scan Source Code
        id: code-scan
        run: |
          echo "# Source Code Security Scan Results" > scan-results/code.md
          
          # Detect code types
          python_files=$(find . -type f -name "*.py" | grep -v "node_modules" | grep -v "venv")
          python_count=$(echo "$python_files" | grep -v "^$" | wc -l)
          
          js_files=$(find . -type f -name "*.js" -o -name "*.ts" | grep -v "node_modules")
          js_count=$(echo "$js_files" | grep -v "^$" | wc -l)
          
          # Run Semgrep for all code
          echo "## Semgrep Results" >> scan-results/code.md
          semgrep --config=auto --json --output scan-results/semgrep.json . || true
          
          # Run Bandit for Python code
          if [ $python_count -gt 0 ]; then
            echo "## Bandit Results (Python)" >> scan-results/code.md
            bandit -r . -f json -o scan-results/bandit.json || true
          fi
          
          # Run npm audit if package.json exists
          if [ -f "package.json" ]; then
            echo "## NPM Audit Results" >> scan-results/code.md
            npm audit --json > scan-results/npm-audit.json || true
          fi
          
          # Run dependency scanning with Trivy
          echo "## Dependency Scanning Results" >> scan-results/code.md
          trivy fs --security-checks vuln --severity HIGH,CRITICAL . > scan-results/trivy-deps.txt || true
      
      # Comprehensive scan with all frameworks
      - name: Run Comprehensive Scan
        id: comprehensive-scan
        run: |
          echo "Running comprehensive scan with all frameworks"
          checkov -d . --output cli --output-file-path scan-results/ || true
      
      # Generate severity-based reports
      - name: Generate Severity Reports
        id: generate-reports
        run: |
          # Create severity-specific files
          echo "# CRITICAL Severity Security Issues" > scan-results/critical-severity.md
          echo "# HIGH Severity Security Issues" > scan-results/high-severity.md
          echo "# MEDIUM Severity Security Issues" > scan-results/medium-severity.md
          
          # Process checkov results for different frameworks
          for framework in kubernetes dockerfile terraform; do
            result_file="scan-results/results_${framework}.txt"
            if [ -f "$result_file" ]; then
              # Extract CRITICAL findings
              grep -A 5 -B 2 "CRITICAL" "$result_file" >> scan-results/critical-severity.md || true
              # Extract HIGH findings
              grep -A 5 -B 2 "HIGH" "$result_file" >> scan-results/high-severity.md || true
              # Extract MEDIUM findings
              grep -A 5 -B 2 "MEDIUM" "$result_file" >> scan-results/medium-severity.md || true
            fi
          done
          
          # Process Trivy results
          if [ -f "scan-results/trivy-deps.txt" ]; then
            echo "## Dependency CRITICAL Vulnerabilities" >> scan-results/critical-severity.md
            grep -A 7 "CRITICAL" scan-results/trivy-deps.txt >> scan-results/critical-severity.md || true
            
            echo "## Dependency HIGH Vulnerabilities" >> scan-results/high-severity.md
            grep -A 7 "HIGH" scan-results/trivy-deps.txt | grep -v "CRITICAL" >> scan-results/high-severity.md || true
          fi
          
          # Process Semgrep results if exists
          if [ -f "scan-results/semgrep.json" ]; then
            # Extract issues by severity using jq if file exists and is valid
            if jq . scan-results/semgrep.json >/dev/null 2>&1; then
              echo "## Semgrep CRITICAL Findings" >> scan-results/critical-severity.md
              jq '.results[] | select(.extra.severity == "ERROR") | {rule: .check_id, file: .path, message: .extra.message}' scan-results/semgrep.json >> scan-results/critical-severity.md || true
              
              echo "## Semgrep HIGH Findings" >> scan-results/high-severity.md
              jq '.results[] | select(.extra.severity == "WARNING") | {rule: .check_id, file: .path, message: .extra.message}' scan-results/semgrep.json >> scan-results/high-severity.md || true
            fi
          fi
          
          # Process tfsec results if exists
          if [ -f "scan-results/tfsec.json" ]; then
            # Extract issues by severity using jq if file exists and is valid
            if jq . scan-results/tfsec.json >/dev/null 2>&1; then
              echo "## TFSec CRITICAL Findings" >> scan-results/critical-severity.md
              jq '.results[] | select(.severity == "CRITICAL") | {rule: .rule_id, file: .location.filename, message: .description}' scan-results/tfsec.json >> scan-results/critical-severity.md || true
              
              echo "## TFSec HIGH Findings" >> scan-results/high-severity.md
              jq '.results[] | select(.severity == "HIGH") | {rule: .rule_id, file: .location.filename, message: .description}' scan-results/tfsec.json >> scan-results/high-severity.md || true
              
              echo "## TFSec MEDIUM Findings" >> scan-results/medium-severity.md
              jq '.results[] | select(.severity == "MEDIUM") | {rule: .rule_id, file: .location.filename, message: .description}' scan-results/tfsec.json >> scan-results/medium-severity.md || true
            fi
          fi
      
      # Analyze and summarize results
      - name: Analyze and Summarize Results
        id: analyze-results
        run: |
          echo "# Infrastructure as Code Security Scan Results" > scan-results/summary.md
          echo "Scan completed at $(date)" >> scan-results/summary.md
          
          # Check if high/critical issues exist
          critical_count=0
          high_count=0
          
          # Count critical issues if file exists and has content
          if [ -s "scan-results/critical-severity.md" ]; then
            critical_count=$(grep -c "CRITICAL\|ERROR" scan-results/critical-severity.md || echo "0")
          fi
          
          # Count high issues if file exists and has content
          if [ -s "scan-results/high-severity.md" ]; then
            high_count=$(grep -c "HIGH\|WARNING" scan-results/high-severity.md || echo "0")
          fi
          
          # Add sections to summary
          echo "## Summary of Findings" >> scan-results/summary.md
          echo "- **CRITICAL Issues:** $critical_count" >> scan-results/summary.md
          echo "- **HIGH Issues:** $high_count" >> scan-results/summary.md
          echo "- **Kubernetes Files Scanned:** $K8S_COUNT" >> scan-results/summary.md
          echo "- **Dockerfile Files Scanned:** $DOCKER_COUNT" >> scan-results/summary.md
          echo "- **Terraform Files Scanned:** $TF_COUNT" >> scan-results/summary.md
          echo "- **Helm Charts Scanned:** $HELM_COUNT" >> scan-results/summary.md
          
          # Print summary
          echo "============================"
          echo "SECURITY SCAN RESULTS"
          echo "============================"
          echo "CRITICAL severity issues: $critical_count"
          echo "HIGH severity issues: $high_count"
          
          # Set exit code based on findings
          if [ $critical_count -gt 0 ]; then
            echo "❌ $critical_count CRITICAL severity issues found. See scan-results/critical-severity.md for details."
            echo "SCAN_FAILED=true" >> $GITHUB_ENV
            exit_code=1
          elif [ $high_count -gt 0 ]; then
            echo "⚠️ $high_count HIGH severity issues found. See scan-results/high-severity.md for details."
            echo "SCAN_WARNING=true" >> $GITHUB_ENV
            exit_code=0
          else
            echo "✅ No HIGH or CRITICAL severity issues found."
            exit_code=0
          fi
          
          echo "Complete scan results available in scan-results/summary.md"
          echo "============================"
          
          # Store exit code for next steps
          echo "SCAN_EXIT_CODE=$exit_code" >> $GITHUB_ENV
      
      - name: Upload Security Scan Results
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results
          path: scan-results/
          retention-days: 90
