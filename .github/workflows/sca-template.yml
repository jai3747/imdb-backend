name: SCA (Software Composition Analysis) Scanning

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
        description: "Path to the scanning configuration file"
      target_environment:
        required: false
        type: string
        default: "all"
        description: "Target environment to scan (frontend/backend/all)"
    secrets:
      GH_PAT:
        required: true
      SNYK_TOKEN:
        required: true

jobs:
  load-config:
    name: 📋 Load Configuration
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.parse-config.outputs.repositories }}
    steps:
    - name: Checkout Config Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Parse Configuration
      id: parse-config
      run: |
        if [ ! -f "${{ inputs.config_file }}" ]; then
          echo "Configuration file not found: ${{ inputs.config_file }}"
          exit 1
        fi

        # Install yq for YAML parsing
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

        # Extract repositories list
        REPOS=$(yq e '.repositories | @json' "${{ inputs.config_file }}")
        echo "repositories=$REPOS" >> $GITHUB_OUTPUT

  sca-scan:
    name: 📦 SCA Scan - ${{ matrix.repo.name }}
    runs-on: ubuntu-latest
    needs: load-config
    strategy:
      matrix:
        repo: ${{ fromJson(needs.load-config.outputs.repositories) }}
      fail-fast: false
    steps:
    - name: Clean workspace
      run: |
        rm -rf * || true
        rm -rf .git || true
        rm -rf .[^.]* || true

    - name: Checkout Target Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repo.repository }}
        token: ${{ secrets.GH_PAT }}
        clean: true

    - name: Setup Python
      if: matrix.repo.language == 'python'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.repo.runtime_version || '3.9' }}

    - name: Setup Node.js
      if: matrix.repo.language == 'node' || matrix.repo.language == 'javascript' || matrix.repo.language == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.repo.runtime_version || '18' }}
        cache: 'npm'

    - name: Setup PHP
      if: matrix.repo.language == 'php'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.repo.runtime_version || '8.1' }}
        tools: composer

    - name: Setup .NET
      if: matrix.repo.language == 'dotnet' || matrix.repo.language == 'csharp'
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.repo.runtime_version || '6.0.x' }}

    - name: Install Dependencies - Python
      if: matrix.repo.language == 'python'
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        elif [ -f Pipfile ]; then
          pip install pipenv && pipenv install --dev
        elif [ -f pyproject.toml ]; then
          pip install poetry && poetry install
        fi

    - name: Install Dependencies - Node.js
      if: matrix.repo.language == 'node' || matrix.repo.language == 'javascript' || matrix.repo.language == 'typescript'
      run: |
        if [ -f package.json ]; then
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        fi

    - name: Install Dependencies - PHP
      if: matrix.repo.language == 'php'
      run: |
        if [ -f composer.json ]; then
          composer install --no-dev --prefer-dist
        fi

    - name: Install Dependencies - .NET
      if: matrix.repo.language == 'dotnet' || matrix.repo.language == 'csharp'
      run: |
        if [ -f *.sln ]; then
          dotnet restore
        elif [ -f *.csproj ]; then
          dotnet restore
        fi

    - name: Run Snyk Test
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        # Install Snyk CLI
        npm install -g snyk

        # Authenticate
        snyk auth ${{ secrets.SNYK_TOKEN }}

        # Run test based on language
        case "${{ matrix.repo.language }}" in
          "node"|"javascript"|"typescript")
            snyk test --json > snyk-report.json || true
            ;;
          "python")
            snyk test --file=requirements.txt --json > snyk-report.json || true
            ;;
          "php")
            snyk test --file=composer.json --json > snyk-report.json || true
            ;;
          "dotnet"|"csharp")
            snyk test --json > snyk-report.json || true
            ;;
        esac

    - name: Generate Summary
      if: always()
      run: |
        echo "# 📦 ${{ matrix.repo.name }} SCA Results" > scan-summary.md
        echo "Repository: ${{ matrix.repo.repository }}" >> scan-summary.md
        echo "Language: ${{ matrix.repo.language }}" >> scan-summary.md
        echo "Scan Date: $(date)" >> scan-summary.md
        echo "" >> scan-summary.md

        if [ -f "snyk-report.json" ]; then
          HIGH_VULNS=$(jq '.vulnerabilities | map(select(.severity == "high")) | length' "snyk-report.json" 2>/dev/null || echo "0")
          CRITICAL_VULNS=$(jq '.vulnerabilities | map(select(.severity == "critical")) | length' "snyk-report.json" 2>/dev/null || echo "0")
          MEDIUM_VULNS=$(jq '.vulnerabilities | map(select(.severity == "medium")) | length' "snyk-report.json" 2>/dev/null || echo "0")
          LOW_VULNS=$(jq '.vulnerabilities | map(select(.severity == "low")) | length' "snyk-report.json" 2>/dev/null || echo "0")
          
          echo "Vulnerability Summary:" >> scan-summary.md
          echo "- Critical: $CRITICAL_VULNS" >> scan-summary.md
          echo "- High: $HIGH_VULNS" >> scan-summary.md
          echo "- Medium: $MEDIUM_VULNS" >> scan-summary.md
          echo "- Low: $LOW_VULNS" >> scan-summary.md
          
          TOTAL_VULNS=$((CRITICAL_VULNS + HIGH_VULNS + MEDIUM_VULNS + LOW_VULNS))
          if [ "$TOTAL_VULNS" -gt 0 ]; then
            echo "" >> scan-summary.md
            echo "⚠️ $TOTAL_VULNS vulnerabilities found - Review and update dependencies" >> scan-summary.md
          else
            echo "" >> scan-summary.md
            echo "✅ No vulnerabilities detected" >> scan-summary.md
          fi
        else
          echo "❌ Scan failed or no dependencies found" >> scan-summary.md
        fi

    - name: Upload Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sca-report-${{ matrix.repo.name }}
        path: |
          snyk-report.json
          scan-summary.md
        retention-days: 30
